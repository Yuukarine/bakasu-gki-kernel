name: build-oneplus
on:
  workflow_dispatch:
    inputs:
      source_repo: {description: OnePlusOSS kernel source URL, required: false, default: https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm7675.git, type: string}
      source_ref: {description: Optional source branch or SHA override, required: false, default: "", type: string}
      modules_ref: {description: Optional OnePlus modules/devicetree branch or SHA override, required: false, default: "", type: string}
      stock_symvers_path: {description: Optional stock Module.symvers path, required: false, type: string}
      stock_symvers_url: {description: Optional stock Module.symvers URL, required: false, type: string}
      gki_prebuilt_symvers: {description: Optional GKI prebuilt Module.symvers path, required: false, type: string}
      custom_driver_name: {description: Optional BakaSU display name (does not change version code), required: false, default: "", type: string}
      target_stock_uname: {description: Optional single matrix target to run, required: false, default: "", type: string}
      bootstrap_stock_symvers: {description: Build unpatched stock baseline on cache miss, required: false, default: false, type: boolean}
      enable_bore: {description: Apply BORE only when HMBIRD is disabled, required: false, default: false, type: boolean}
      toolchain: {description: Toolchain identity for cache validation, required: false, default: clang-r547379, type: string}
  push:
    paths: ['configs/**', 'patches/**', 'scripts/**', '.github/workflows/build-oneplus.yml']
permissions: {contents: read}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {device: ace3v, soc: SM7675, kmi: android14-6.1, stock_uname: 6.1.118-android14-11-o-gac2e718ebee6, source_ref: 65c3035422d899d95bfde4e30dc426712ffe52f2, modules_ref: ce7f91fa81af835ce1b70abbd8aca4b876c924a3, page_size: 4096, hmbird: false}
          - {device: ace3v, soc: SM7675, kmi: android14-6.1, stock_uname: 6.1.141-android14-11-o-gffc54a6d2287, source_ref: 3bcb2b3b5f0ad367fef9c7463be0cb17e0b7c2a8, page_size: 4096, hmbird: false}
    runs-on: ubuntu-24.04
    env:
      KMI: ${{ matrix.kmi }}
      STOCK_UNAME: ${{ matrix.stock_uname }}
      PAGE_SIZE: ${{ matrix.page_size }}
      TOOLCHAIN_ID: ${{ inputs.toolchain || 'clang-r547379' }}
      SOURCE_REPO: ${{ inputs.source_repo || 'https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm7675.git' }}
      SOURCE_REF: ${{ inputs.source_ref || matrix.source_ref }}
      MODULES_REPO: https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm7675.git
      MODULES_REF: ${{ inputs.modules_ref || matrix.modules_ref || 'oneplus/sm7675_b_16.0.0_ace_3v' }}
      BAKASU_REPO: https://github.com/Baka-SU/BakaSU.git
      BAKASU_REF: main
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_REF: gki-android14-6.1
      ARCH: arm64
      LLVM: "1"
      JOBS: "2"
      KCFLAGS: -Wno-error=unused-function
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust ktool
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ktool
      - name: Build Rust ktool
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/ktool/Cargo.toml
          echo "KTOOL_BIN=$GITHUB_WORKSPACE/tools/ktool/target/release/ktool" >> "$GITHUB_ENV"
      - name: Free runner disk space
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo docker system prune -af || true
      - name: Install kernel build dependencies
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev dwarves cpio rsync clang lld llvm
      - name: Checkout OnePlus source
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          git clone --depth 1 "$MODULES_REPO" .tmp/kernel_src
          git -C .tmp/kernel_src fetch --depth 1 origin "$MODULES_REF"
          git -C .tmp/kernel_src checkout --detach FETCH_HEAD
          mkdir -p .tmp/kernel_src/kernel_platform
          git clone --depth 1 "$SOURCE_REPO" .tmp/kernel_src/kernel_platform/common
          git -C .tmp/kernel_src/kernel_platform/common fetch --depth 1 origin "$SOURCE_REF"
          git -C .tmp/kernel_src/kernel_platform/common checkout --detach FETCH_HEAD
          echo "SOURCE_SHA=$(git -C .tmp/kernel_src/kernel_platform/common rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Restore stock Module.symvers cache
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cache-Module.symvers
          key: stock-module-symvers-oneplus-${{ matrix.kmi }}-${{ matrix.stock_uname }}-${{ matrix.page_size }}-${{ github.sha }}
          restore-keys: |
            stock-module-symvers-oneplus-${{ matrix.kmi }}-${{ matrix.stock_uname }}-${{ matrix.page_size }}-
      - name: Resolve stock Module.symvers
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        id: symvers
        env:
          STOCK_PATH: ${{ inputs.stock_symvers_path }}
          STOCK_URL: ${{ inputs.stock_symvers_url }}
          PREBUILT: ${{ inputs.gki_prebuilt_symvers }}
        run: |
          set -euo pipefail
          cache_key="stock-module-symvers-oneplus-${KMI}-${STOCK_UNAME}-${PAGE_SIZE}-${GITHUB_SHA}"
          cache_prefix="stock-module-symvers-oneplus-${KMI}-${STOCK_UNAME}-${PAGE_SIZE}"
          args=(--output "$RUNNER_TEMP/stock-Module.symvers" --cache "$RUNNER_TEMP/cache-Module.symvers" --cache-meta "$RUNNER_TEMP/cache-Module.symvers/metadata" --prebuilt "${PREBUILT:-}" --expected-cache-key "$cache_prefix" --kmi "$KMI" --page-size "$PAGE_SIZE" --stock-uname "$STOCK_UNAME" --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN_ID")
          [[ -n "${STOCK_PATH:-}" ]] && args+=(--input "$STOCK_PATH")
          [[ -n "${STOCK_URL:-}" ]] && args+=(--url "$STOCK_URL")
          if [[ "${{ inputs.bootstrap_stock_symvers || false }}" == true ]]; then args+=(--bootstrap 'KERNEL_SOURCE_DIR=.tmp/kernel_src/kernel_platform/common STOCK_KERNEL_OUT=.tmp/stock-out KBUILD_MODPOST_WARN=1 scripts/bootstrap_stock_symvers.sh'); fi
          scripts/resolve_stock_symvers.sh "${args[@]}" | tee "$RUNNER_TEMP/symvers.env"
          cat "$RUNNER_TEMP/symvers.env" >> "$GITHUB_OUTPUT"
          if grep -q '^resolver_source=bootstrap$' "$RUNNER_TEMP/symvers.env"; then
            mkdir -p "$RUNNER_TEMP/cache-Module.symvers"
            cp "$RUNNER_TEMP/stock-Module.symvers" "$RUNNER_TEMP/cache-Module.symvers/Module.symvers"
            sha=$(sha256sum "$RUNNER_TEMP/cache-Module.symvers/Module.symvers" | awk '{print $1}')
            printf 'cache_key=%s\nkmi=%s\npage_size=%s\nstock_uname=%s\nsource_sha=%s\ntoolchain=%s\nsha256=%s\n' "$cache_key" "$KMI" "$PAGE_SIZE" "$STOCK_UNAME" "$SOURCE_SHA" "$TOOLCHAIN_ID" "$sha" > "$RUNNER_TEMP/cache-Module.symvers/metadata"
          fi
      - name: Save bootstrapped stock Module.symvers cache
        if: ${{ (!inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname) && steps.symvers.outputs.resolver_source == 'bootstrap' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cache-Module.symvers
          key: stock-module-symvers-oneplus-${{ matrix.kmi }}-${{ matrix.stock_uname }}-${{ matrix.page_size }}-${{ github.sha }}
      - name: Apply declared patch sources after stock baseline resolution
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        env:
          PATCH_FEATURES: bakasu,susfs-v2.4.0,unicode-bypass-fix,faster-sdp-900ma,amneziawg
        run: |
          set -euo pipefail
          KERNEL_SOURCE_DIR=.tmp/kernel_src/kernel_platform/common bash scripts/apply_patch_sources.sh
      - name: Integrate BakaSU kernel core
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BAKASU_REF" "$BAKASU_REPO" .tmp/BakaSU
          common=.tmp/kernel_src/kernel_platform/common
          test -d "$common/drivers" && test -f "$common/drivers/Kconfig" && test -f "$common/drivers/Makefile"
          ln -s "$GITHUB_WORKSPACE/.tmp/BakaSU/kernel" "$common/drivers/kernelsu"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$common/drivers/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$common/drivers/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$common/drivers/Kconfig" || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$common/drivers/Kconfig"
      - name: Apply SUSFS v2.4.0 kernel integration
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SUSFS_REF" "$SUSFS_REPO" .tmp/susfs
          git clone --depth 1 https://github.com/Bouteillepleine/kernel_patches.git .tmp/kernel_patches
          common=.tmp/kernel_src/kernel_platform/common
          COMMON_KERNEL_FOLDER="$PWD/$common" SUSFS_FOLDER="$PWD/.tmp/susfs" KSU_FOLDER="$PWD/.tmp/BakaSU" ANDROID_VER=android14 KERNEL_VER=6.1 SUSFS_KERNEL_BRANCH=gki-android14-6.1 bash .tmp/kernel_patches/scripts/apply_susfs_kernel.sh all
          sed -i '/#define SUSFS_LOGE(fmt, ...)/a #define SUSFS_LOGI_RL(fmt, ...) do { } while (0)\n#define SUSFS_LOGE_RL(fmt, ...) do { } while (0)' "$common/fs/susfs.c"
      - name: Set custom BakaSU driver display name
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        env:
          CUSTOM_DRIVER_NAME: ${{ inputs.custom_driver_name }}
        run: bash scripts/set_bakasu_driver_name.sh --file .tmp/BakaSU/kernel/Kbuild
      - name: Prepare baseline Kconfig
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          mkdir -p out
          make -C .tmp/kernel_src/kernel_platform/common O="$PWD/out" gki_defconfig
      - name: Apply BORE before build when selected
        if: ${{ (!inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname) && inputs.enable_bore == true && matrix.hmbird == false }}
        env:
          BORE_PATCH_URL: https://raw.githubusercontent.com/firelzrd/bore-scheduler/main/patches/legacy/linux-6.1-bore/0001-linux6.1.y-bore5.1.0.patch
          KERNEL_SOURCE_DIR: .tmp/kernel_src/kernel_platform/common
        run: |
          set -euo pipefail
          BORE_PATCH_URL="$BORE_PATCH_URL" bash scripts/apply_bore.sh
      - name: Merge branch config and olddefconfig
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          test -d .tmp/kernel_src/kernel_platform/common
          mkdir -p out
          if [[ -x .tmp/kernel_src/kernel_platform/common/scripts/kconfig/merge_config.sh ]]; then .tmp/kernel_src/kernel_platform/common/scripts/kconfig/merge_config.sh -m -O out out/.config configs/bakasu_stealth.fragment configs/oneplus_extras.fragment; fi
          make -C .tmp/kernel_src/kernel_platform/common O="$PWD/out" olddefconfig
          scripts/verify_kconfig.sh --config out/.config --branch oneplus-ogki
      - name: Build OnePlus OGKI
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        env: {KERNEL_SOURCE_DIR: .tmp/kernel_src/kernel_platform/common, KERNEL_OUT: out}
        run: scripts/build_oneplus.sh
      - name: Verify Image UTS release before ABI/package
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: scripts/verify_image_release.sh --image out/arch/arm64/boot/Image --expected "$STOCK_UNAME"
      - name: ABI CRC gate (BORE hard gate when selected)
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/stock-Module.symvers"
          test -s Module.symvers
          if [[ "${{ inputs.enable_bore || false }}" == true ]]; then scripts/verify_abi_crc.sh --bore "$RUNNER_TEMP/stock-Module.symvers" Module.symvers; else scripts/verify_abi_crc.sh "$RUNNER_TEMP/stock-Module.symvers" Module.symvers; fi
      - name: Package AnyKernel ZIP and checksum
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: scripts/package_anykernel.sh --template anykernel/oneplus --image out/arch/arm64/boot/Image --name "oneplus-${{ matrix.device }}-${{ matrix.stock_uname }}" --output-dir artifacts
      - name: Save boot/package provenance
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf 'source_sha=%s\nkmi=%s\npage_size=%s\nstock_uname=%s\nresolver_source=%s\nresolver_sha256=%s\n' "$(git -C .tmp/kernel_src/kernel_platform/common rev-parse HEAD)" "$KMI" "$PAGE_SIZE" "$STOCK_UNAME" "$(grep '^resolver_source=' "$RUNNER_TEMP/symvers.env" | cut -d= -f2-)" "$(grep '^sha256=' "$RUNNER_TEMP/symvers.env" | cut -d= -f2-)" > artifacts/oneplus-provenance.txt
      - name: Upload AnyKernel3 artifact
        if: ${{ !inputs.target_stock_uname || matrix.stock_uname == inputs.target_stock_uname }}
        uses: actions/upload-artifact@v4
        with:
          name: oneplus-${{ matrix.device }}-${{ matrix.stock_uname }}
          path: artifacts/*
          if-no-files-found: error
