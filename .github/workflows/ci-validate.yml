name: ci-validate
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell and YAML syntax
        run: |
          set -euo pipefail
          bash -n scripts/verify_abi_crc.sh scripts/resolve_stock_symvers.sh
          if command -v ruby >/dev/null 2>&1; then ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "YAML OK: #{f}" }' .github/workflows/*.yml; else python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              print('PyYAML unavailable; workflow files are checked by GitHub Actions parser')
          else:
              for p in pathlib.Path('.github/workflows').glob('*.yml'): yaml.safe_load(p.read_text()); print(f'YAML OK: {p}')
          PY
          fi
      - name: CRC and resolver fixtures
        run: tests/test_abi_crc.sh
