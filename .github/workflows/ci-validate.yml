name: ci-validate
on:
  pull_request:
  push: {branches: [main, master]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find anykernel -name '*.sh' -print0 | xargs -0 -n1 sh -n
          if command -v shellcheck >/dev/null 2>&1; then
            find scripts -name '*.sh' -print0 | xargs -0 shellcheck -s bash
            find anykernel -name '*.sh' -print0 | xargs -0 shellcheck -s sh
          fi
      - name: YAML syntax
        run: |
          set -euo pipefail
          if command -v actionlint >/dev/null 2>&1; then actionlint .github/workflows/*.yml; fi
          python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              print('PyYAML unavailable; GitHub parser remains authoritative')
          else:
              for p in pathlib.Path('.github/workflows').glob('*.yml'):
                  yaml.safe_load(p.read_text()); print(f'YAML OK: {p}')
          PY
      - name: Fixture gates
        run: |
          set -euo pipefail
          tests/test_kconfig.sh
          tests/test_abi_crc.sh
          tests/test_anykernel.sh
          tests/test_driver_name.sh
          tests/test_image_release.sh
