name: ci-validate
on:
  pull_request:
  push: {branches: [main, master]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust ktool
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ktool
      - name: Verify and build Rust ktool
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo fmt --check --manifest-path tools/ktool/Cargo.toml
          cargo clippy --manifest-path tools/ktool/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/ktool/Cargo.toml --locked
          cargo build --release --locked --manifest-path tools/ktool/Cargo.toml
          echo "KTOOL_BIN=$GITHUB_WORKSPACE/tools/ktool/target/release/ktool" >> "$GITHUB_ENV"
      - name: Shell syntax and lint
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find anykernel -name '*.sh' -print0 | xargs -0 -n1 sh -n
          if command -v shellcheck >/dev/null 2>&1; then
            find scripts -name '*.sh' -print0 | xargs -0 shellcheck -s bash
            find anykernel -name '*.sh' -print0 | xargs -0 shellcheck -s sh
          fi
      - name: YAML syntax
        run: |
          set -euo pipefail
          if command -v actionlint >/dev/null 2>&1; then actionlint .github/workflows/*.yml; fi
          python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              print('PyYAML unavailable; GitHub parser remains authoritative')
          else:
              for p in pathlib.Path('.github/workflows').glob('*.yml'):
                  yaml.safe_load(p.read_text()); print(f'YAML OK: {p}')
          PY
      - name: Fixture gates
        run: |
          set -euo pipefail
          for test in tests/*.sh; do bash "$test"; done
